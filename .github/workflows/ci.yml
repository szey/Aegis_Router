name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(find cmd internal web experiments -type f -name '*.go'))"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: go build -trimpath ./cmd/server ./cmd/discover ./cmd/observe

      - name: Type-check frontend
        run: npm run check:web

      - name: Build frontend
        run: npm run build:web -- --log-level=warning

      - name: Verify generated frontend is committed
        run: git diff --exit-code -- web/static/app.js

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build container
        run: docker build -t aegis-router:ci .
